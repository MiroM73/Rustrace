[package]
name = "rustrace"
version = "0.6.1"
edition = "2024"
license = "Unlicense"
description = "A CMTrace-style log viewer"
repository = "https://github.com/MiroM73/Rustrace"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
egui_extras = "0.37"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.17"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3"
open = "5"
memmap2 = "0.9"
sha2 = "0.11"
flate2 = "1"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1"
