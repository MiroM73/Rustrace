# Checks every push to master and every pull request:
# - Windows (the main platform): formatting, clippy, tests and a release build uploaded as an artifact
# - Linux: clippy and tests, so the non-Windows build keeps working
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v5
        with:
          name: rustrace-windows-${{ github.sha }}
          path: target/release/rustrace.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
