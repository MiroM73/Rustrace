# Builds the Windows release and packages it as a self-extracting archive and a plain ZIP.
# - push of a tag "v*"  -> creates a draft GitHub release with both archives attached
# - manual run          -> only uploads the archive as a workflow artifact (for testing)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          ./scripts/package.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        with:
          name: rustrace-windows
          path: dist/*

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*) `
            --draft --title 'RusTrace ${{ github.ref_name }}' --generate-notes
